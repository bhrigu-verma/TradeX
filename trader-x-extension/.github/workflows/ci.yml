name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dashboard:
    name: Dashboard Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traderx-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: traderx-dashboard/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Server Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traderx-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: traderx-server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package server image context check
        run: |
          test -f package.json
          test -f src/index.js
