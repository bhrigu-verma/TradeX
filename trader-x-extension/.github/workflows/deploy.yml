name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy_dashboard_vercel:
    name: Deploy Dashboard to Vercel
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: traderx-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build dashboard artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: traderx-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy dashboard
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: traderx-dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy_server_render:
    name: Deploy Server to Render
    runs-on: ubuntu-latest
    needs: [deploy_dashboard_vercel]
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait before health check
        run: sleep 30

      - name: Health check api
        run: |
          test -n "${{ secrets.API_HEALTHCHECK_URL }}"
          curl -fsS "${{ secrets.API_HEALTHCHECK_URL }}"

  deployment_summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy_dashboard_vercel, deploy_server_render]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "Dashboard job result: ${{ needs.deploy_dashboard_vercel.result }}"
          echo "Server job result: ${{ needs.deploy_server_render.result }}"
          if [ "${{ needs.deploy_dashboard_vercel.result }}" = "skipped" ]; then
            echo "Dashboard deploy skipped. Add VERCEL_* secrets."
          fi
          if [ "${{ needs.deploy_server_render.result }}" = "skipped" ]; then
            echo "Server deploy skipped. Add RENDER_DEPLOY_HOOK_URL secret."
          fi
